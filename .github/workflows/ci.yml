name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build before typecheck: the test kit typechecks against core's emitted
      # declarations, so core has to exist first.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # The corpus is committed. Regenerating it must be a no-op, otherwise the
      # checked-in JSON has drifted from the case definitions.
      - name: Corpus is up to date
        run: |
          npm run corpus
          git diff --exit-code -- packages/testkit/corpus

      # The reference implementation must stay at 100%. A failure here means a
      # corpus expectation is wrong.
      - name: Reference implementation scores 100%
        run: node packages/testkit/dist/cli.js test --reference --fail-on any

      - name: Compatibility report
        if: always()
        run: |
          node packages/testkit/dist/cli.js test --reference --format markdown \
            >> "$GITHUB_STEP_SUMMARY"
